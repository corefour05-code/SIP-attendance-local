<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PSNA IT Department — SIP Attendance{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="topnav">
        <div class="topnav-inner">
            <a href="/enroll" class="brand">
                <span class="brand-mark"></span>
                <span class="brand-text">
                    <span class="brand-title">PSNA IT Department</span>
                    <span class="brand-sub">SIP Attendance</span>
                </span>
            </a>
            <div class="nav-links">
                <a href="/enroll" class="{{ 'active' if request.url.path == '/enroll' else '' }}">Enroll</a>
                <a href="/students" class="{{ 'active' if request.url.path.startswith('/students') else '' }}">Students</a>
                <a href="/scan" class="{{ 'active' if request.url.path == '/scan' else '' }}">Scan</a>
                <a href="/report" class="{{ 'active' if request.url.path == '/report' else '' }}">Report</a>
            </div>
        </div>
    </nav>
    <main class="container {% block container_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
